[project]
name = "medquote-extractor"
version = "0.1.0"
description = "Phase 1 throwaway extraction script for medical equipment quotes"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
